[project]
name = "mlinphysics"
version = "0.1.0"
description = "A module for the ML examples in the course Machine Learning in Physics at Florida State University."
readme = "README.md"
authors = [
  { name="Harrison B. Prosper", email="hprosper@fsu.edu" }
]
license = { text = "MIT" }
dependencies = [
  # e.g. "numpy>=1.20", "requests"
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
monlosses = "mlinphysics.bin.monitor_losses:main"

[project.urls]
"Homepage" = "https://github.com/hbprosper/mlinphysics"